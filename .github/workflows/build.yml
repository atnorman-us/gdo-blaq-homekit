name: Build ESP-IDF Project

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build and Generate Combined Firmware
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4.1
        target: esp32s3
        path: '.'
        command: |
          idf.py build
          python scripts/merge-firmware.py build build/konnected-gdo-blaq-homekit.bin
          idf.py size > size-report.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: konnected-gdo-blaq-homekit-parts
        path: |
          build/gdo-blaq-homekit.bin
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/flasher_args.json
          build/ota_data_initial.bin
        if-no-files-found: error

    - name: Upload combined firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: konnected-gdo-blaq-homekit
        path: build/konnected-gdo-blaq-homekit.bin
        if-no-files-found: error

    - name: Archive build size report
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-size-report
        path: size-report.txt
        if-no-files-found: ignore

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download application image
      uses: actions/download-artifact@v4
      with:
        name: konnected-gdo-blaq-homekit-parts
        path: release-parts

    - name: Download combined image
      uses: actions/download-artifact@v4
      with:
        name: konnected-gdo-blaq-homekit
        path: release-combined

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Publish release firmware
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        mkdir -p release-assets
        cp release-parts/gdo-blaq-homekit.bin "release-assets/gdo-blaq-homekit-${RELEASE_TAG}-ota.bin"
        cp release-combined/konnected-gdo-blaq-homekit.bin "release-assets/konnected-gdo-blaq-homekit-${RELEASE_TAG}.bin"
        (cd release-assets && sha256sum *.bin > SHA256SUMS.txt)
        gh release upload "$RELEASE_TAG" release-assets/* --clobber

    - name: Publish firmware to Cloudflare R2
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        FIRMWARE_FILE="konnected-gdo-blaq-homekit-${RELEASE_TAG}.bin"
        npx --yes wrangler@4 r2 object put "gdo-blaq-firmware/${FIRMWARE_FILE}" \
          --file "release-assets/${FIRMWARE_FILE}" \
          --content-type application/octet-stream \
          --remote
        echo "{\"version\":\"${RELEASE_TAG}\",\"file\":\"${FIRMWARE_FILE}\"}" > /tmp/current.json
        npx --yes wrangler@4 r2 object put "gdo-blaq-firmware/current.json" \
          --file /tmp/current.json \
          --content-type application/json \
          --remote
